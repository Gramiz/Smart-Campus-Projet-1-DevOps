services:
  db:
    image: mariadb:11
    container_name: smart_campus_db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-campus_smart_manager}
      MARIADB_USER: ${MARIADB_USER:-campus_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-campus_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/bd:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${REGISTRY}/${IMAGE_OWNER}/smart-campus-backend:${IMAGE_TAG:-latest}
    container_name: smart_campus_backend
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-campus_user}:${MARIADB_PASSWORD:-campus_password}@db:3306/${MARIADB_DATABASE:-campus_smart_manager}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${REGISTRY}/${IMAGE_OWNER}/smart-campus-frontend:${IMAGE_TAG:-latest}
    container_name: smart_campus_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: smart_campus_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: smart_campus_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-campus_smart_manager}
      MARIADB_USER: ${MARIADB_USER:-campus_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-campus_password}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - db
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: smart_campus_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: smart_campus_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: smart_campus_promtail
    volumes:
      - /var/log:/var/log:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smart_campus_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mariadb_data:
  prometheus_data:
  grafana_data:

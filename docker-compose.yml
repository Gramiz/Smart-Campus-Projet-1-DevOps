services:
  db:
    image: mariadb:11
    container_name: smart_campus_db
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: campus_smart_manager
      MARIADB_USER: campus_user
      MARIADB_PASSWORD: campus_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/bd:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: smart_campus_backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://campus_user:campus_password@db:3306/campus_smart_manager
      - SECRET_KEY=change-me-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smart_campus_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mariadb_data:

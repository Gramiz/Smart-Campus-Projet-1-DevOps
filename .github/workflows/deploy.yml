name: CD AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: smart-campus-backend
  FRONTEND_IMAGE: smart-campus-frontend

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose production config
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=${{ env.REGISTRY }} IMAGE_OWNER=$IMAGE_OWNER docker compose -f docker-compose.prod.yml config

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image owner
        id: image-owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.value }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.value }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.value }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ steps.image-owner.outputs.value }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://${{ secrets.HOST }}:8080
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/Smart-Campus-Projet-1-DevOps
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG="${{ github.sha }}"

            echo "Checking access to ghcr.io from EC2..."
            getent hosts ghcr.io || true
            curl -fsSI --connect-timeout 10 --max-time 30 https://ghcr.io/v2/ || true

            for attempt in 1 2 3; do
              echo "${{ secrets.TOKENCICD }}" | timeout 60 docker login ghcr.io -u "${{ github.actor }}" --password-stdin && break
              if [ "$attempt" = "3" ]; then
                echo "docker login to ghcr.io failed after 3 attempts"
                exit 1
              fi
              echo "docker login to ghcr.io failed, retrying in 15 seconds..."
              sleep 15
            done

            docker image prune -af
            docker builder prune -af

            for attempt in 1 2 3; do
              REGISTRY=${{ env.REGISTRY }} IMAGE_OWNER=$IMAGE_OWNER IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull && break
              if [ "$attempt" = "3" ]; then
                echo "docker compose pull failed after 3 attempts"
                exit 1
              fi
              echo "docker compose pull failed, retrying in 15 seconds..."
              sleep 15
            done
            REGISTRY=${{ env.REGISTRY }} IMAGE_OWNER=$IMAGE_OWNER IMAGE_TAG=$IMAGE_TAG VITE_API_BASE_URL=http://${{ secrets.HOST }}:8080 CORS_ORIGINS=http://${{ secrets.HOST }}:5173 docker compose -f docker-compose.prod.yml up -d

            curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:5173
            curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:8080/
            curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:3000/api/health
            curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:9090/-/healthy
            curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:8081/
            curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://localhost:8082/
            curl --retry 20 --retry-delay 3 --retry-connrefused http://localhost:3100/ready || true

            docker image prune -af

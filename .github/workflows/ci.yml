name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall main.py

      - name: Validate FastAPI app import
        run: python -c "import main; print(main.app.title)"

      - name: Test API endpoints
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/openapi.json

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smart-campus-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t smart-campus-frontend:ci ./frontend

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod --build-arg VITE_API_BASE_URL=http://localhost:8080 -t smart-campus-frontend:prod-ci ./frontend

      - name: Validate Docker Compose config
        run: |
          MARIADB_ROOT_PASSWORD=root_password \
          MARIADB_DATABASE=campus_smart_manager \
          MARIADB_USER=campus_user \
          MARIADB_PASSWORD=campus_password \
          DATABASE_URL=mysql+pymysql://campus_user:campus_password@db:3306/campus_smart_manager \
          SECRET_KEY=ci-secret \
          ACCESS_TOKEN_EXPIRE_MINUTES=60 \
          CORS_ORIGINS=http://localhost:5173 \
          VITE_API_BASE_URL=http://localhost:8080 \
          GF_SECURITY_ADMIN_PASSWORD=admin \
          GF_USERS_ALLOW_SIGN_UP=false \
          docker compose config

      - name: Validate Docker Compose production config
        run: |
          REGISTRY=ghcr.io \
          IMAGE_OWNER=ci \
          VITE_API_BASE_URL=http://localhost:8080 \
          CORS_ORIGINS=http://localhost:5173 \
          docker compose -f docker-compose.prod.yml config

      - name: Validate Prometheus config
        run: docker run --rm --entrypoint promtool -v "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" prom/prometheus:latest check config /etc/prometheus/prometheus.yml

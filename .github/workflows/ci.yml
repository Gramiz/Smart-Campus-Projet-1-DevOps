name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall main.py

      - name: Validate FastAPI app import
        run: python -c "import main; print(main.app.title)"

      - name: Test API endpoints
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          curl --retry 10 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8000/
          curl --fail http://127.0.0.1:8000/api/sensors
          curl --fail http://127.0.0.1:8000/api/reservations

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smart-campus-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t smart-campus-frontend:ci ./frontend

      - name: Validate Docker Compose config
        run: docker compose config
